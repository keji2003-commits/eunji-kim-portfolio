  const sway = current || reduce ? .12 : 1;
  if (targets.length && (boxTick++ % 45 === 0)) refreshBoxes();
  if (pendingPick) { const h = pickAt(pendingPick[0], pendingPick[1]); pendingPick = null; if (h !== hover) { hover = h; canvas.style.cursor = h ? 'pointer' : 'default'; } }
  const fm = 1 - Math.pow(.88, dt * 60); smx += (mx - smx) * fm; smy += (my - smy) * fm;
  camera.position.set(camPos.x + smx * 1.0 * sway, camPos.y - smy * .4 * sway + (reduce ? 0 : Math.sin(t * .5) * .04), camPos.z);
  camera.lookAt(camLook);

  const f15 = 1 - Math.pow(.85, dt * 60), f08 = 1 - Math.pow(.92, dt * 60);
  for (const tg of targets) {
    const on = hover === tg.key || current === tg.key;
    tg.group.position.y += ((tg.baseY + (on && !reduce ? .05 : 0)) - tg.group.position.y) * f15;
    for (const c of tg.tint) c.m.emissiveIntensity += ((c.base + (on ? .07 : 0)) - c.m.emissiveIntensity) * f15;
  }
  if (hailey && !reduce) {
    const it = t - introAt, e3 = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3), sm = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
    if (doorPivot) doorPivot.rotation.y = DOOR.closed * (1 - e3((it - .5) / 1.3));
    const reach = 1 - sm((it - 1.5) / 1.1);           // 1: 문을 여는 자세, 0: 평소 자세
    hailey.rotation.y = H_ROT - .95 * reach + Math.sin(t * .6) * .04 * (1 - reach);
    hailey.rotation.z = .07 * reach;
    hailey.position.x = H_POS.x - .16 * reach;
    hailey.position.z = H_POS.z - .12 * reach;
    // 호흡: 아주 작은 상하 + 어깨 폭
    if (hBody) { hBody.position.y = hBodyY + Math.sin(t * 1.7) * .006; hBody.scale.set(1 + Math.sin(t * 1.7) * .003, 1, 1 + Math.sin(t * 1.7) * .003); }
    // 행택: 문이 움직인 직후 크게, 이후 가볍게 흔들림
    if (tag) { const amp = .05 + .28 * Math.max(0, 1 - Math.max(0, it - .5) / 4); const sw = tag.userData.swing; sw.rotation.z = Math.sin(t * 2.6) * amp; sw.rotation.x = Math.sin(t * 1.9 + 1) * amp * .5; }
  }
  // 호버 스팟: 가리킨 대상 위쪽 앞으로 이동하며 켜짐
  const focusKey = hover || current;
  if (focusKey) spotGoal.copy(HOT[focusKey]).add(tmpV.set(0, .5, 1.1));
  spot.position.lerp(spotGoal, f08);
  spot.intensity += ((focusKey && !reduce ? 3 : 0) - spot.intensity) * f08;
  if (tag) tag.getWorldPosition(HOT.contact);
  hotEls.forEach(h => {
    const p = tmpV.copy(HOT[h.dataset.k]).project(camera);
    h.style.transform = `translate(${(p.x * .5 + .5) * innerWidth}px, ${(-p.y * .5 + .5) * innerHeight}px)`;
    h.style.visibility = p.z < 1 ? 'visible' : 'hidden';
  });
  if (!reduce) driftDust(t);
  renderer.render(scene, camera);
} catch (e) { window.__err = String(e && e.stack || e); } }
if (!DEMO) renderer.setAnimationLoop(tick);

// 데모 시나리오: 인트로 → 락커 호버 → Work → About → Now → Contact → 홈. 외부에서 __seek(t) 로 프레임 단위 구동.
const DEMO_EVENTS = [[5.0, 'hover', 'work'], [6.0, 'go', 'work'], [11.5, 'go', 'about'], [17.0, 'go', 'mirror'], [22.5, 'go', 'contact'], [27.5, 'go', null]];
let demoIdx = 0, demoCur = null, demoT0 = 0;
const sm01 = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
window.__seek = (t) => {
  clock.t = t; if (t === 0) introAt = 1.0; // 데모: 로더가 걷힌 뒤 문이 열리도록 1초 지연
  while (demoIdx < DEMO_EVENTS.length && DEMO_EVENTS[demoIdx][0] <= t) { const [, kind, key] = DEMO_EVENTS[demoIdx++]; if (kind === 'hover') hover = key; else { hover = null; go(key); demoCur = key; demoT0 = t; } }
  mx = Math.sin(t * .35) * .22; my = Math.cos(t * .27) * .12;
  document.getElementById('loader').style.opacity = String(1 - sm01((t - .3) / .9));
  const e = demoCur ? sm01((t - demoT0 - .45) / .5) : 1 - sm01((t - demoT0) / .4);
  panel.style.opacity = String(e); panel.style.transform = `translate(${30 * (1 - e)}px,-50%)`;
  hint.style.opacity = String(t < 5.5 ? sm01((t - 1.6) / .6) : 1 - sm01((t - 5.5) / .5));
  tick();
};

window.__dbg = { go, loaded:false, dust, replay(){ introAt = clock.elapsedTime; camPos.copy(homePos().add(V(.4, .5, 3.2))); } };
</script>
